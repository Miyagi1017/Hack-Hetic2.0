<!doctype html>
<html lang="fr">
  <head>
    <script>
      // Ignore WebSocket/HMR disconnect errors in iframe preview per environment instructions
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client') || e.message.includes('createWebSocketModuleRunnerTransport'))) ||
          (e.filename && e.filename.includes('@vite/client'))
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
